AWSTemplateFormatVersion: "2010-09-09"
Description: WORLDLINE container build and network bootstrap

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

Resources:
  ChangefeedRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: worldline/changefeed
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the five newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

  BuildSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-build-sources
            Status: Enabled
            ExpirationInDays: 7

  ChangefeedSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WORLDLINE changefeed egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: WORLDLINE

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worldline-changefeed-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${BuildSourceBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ChangefeedRepository.Arn

  ChangefeedBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: worldline-changefeed-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 15
      Source:
        Type: S3
        Location: !Sub "${BuildSourceBucket}/changefeed-source.zip"
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: WORLDLINE_ECR_URI
            Value: !GetAtt ChangefeedRepository.RepositoryUri
          - Name: WORLDLINE_AWS_REGION
            Value: !Ref AWS::Region

Outputs:
  ChangefeedRepositoryUri:
    Value: !GetAtt ChangefeedRepository.RepositoryUri
  BuildSourceBucketName:
    Value: !Ref BuildSourceBucket
  ChangefeedBuildProject:
    Value: !Ref ChangefeedBuild
  ChangefeedSecurityGroupId:
    Value: !GetAtt ChangefeedSecurityGroup.GroupId
