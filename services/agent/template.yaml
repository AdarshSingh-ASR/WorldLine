AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WORLDLINE memory-first autonomous commitment API

Parameters:
  DatabaseSecretArn:
    Type: String
  AllowedOrigin:
    Type: String
    Default: "*"
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 768
    Environment:
      Variables:
        WORLDLINE_DATABASE_URL: !Sub "{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:runtimeDatabaseUrl}}"
        WORLDLINE_ALLOWED_ORIGIN: !Ref AllowedOrigin
        WORLDLINE_AWS_REGION: !Ref AWS::Region
        WORLDLINE_BEDROCK_MODEL_ID: !Ref BedrockModelId
        WORLDLINE_EMBED_MODEL_ID: !Ref EmbedModelId
        WORLDLINE_BEDROCK_STATE: "account-not-authorized"
        WORLDLINE_RECEIPT_BUCKET: !Ref ReceiptBucket
        WORLDLINE_DEMO_FALLBACK: "false"

Resources:
  WorldlineHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type, x-idempotency-key]
        AllowMethods: [GET, POST, OPTIONS]

  WorldlineAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      FunctionUrlConfig:
        AuthType: NONE
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorldlineHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ReceiptBucket
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"

  WorldlineWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: worldline-stream
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WorldlineWebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/websocket.handler

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WorldlineWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt WorldlineWebSocketFunction.Arn

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorldlineWebSocketApi
      RouteKey: "$connect"
      AuthorizationType: NONE
      Target: !Sub integrations/${WebSocketIntegration}

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorldlineWebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub integrations/${WebSocketIntegration}

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorldlineWebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub integrations/${WebSocketIntegration}

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
      - WebSocketDefaultRoute
    Properties:
      ApiId: !Ref WorldlineWebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WorldlineWebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: live

  WebSocketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WorldlineWebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WorldlineWebSocketApi}/*

  ReceiptBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

Outputs:
  ApiUrl:
    Value: !Sub "https://${WorldlineHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  FunctionUrl:
    Value: !GetAtt WorldlineAgentFunctionUrl.FunctionUrl
  ReceiptBucketName:
    Value: !Ref ReceiptBucket
  WebSocketUrl:
    Value: !Sub "wss://${WorldlineWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live"
  AgentFunctionName:
    Value: !Ref WorldlineAgentFunction
  WebSocketFunctionName:
    Value: !Ref WorldlineWebSocketFunction
