<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">WORLDLINE architecture</title>
  <desc id="desc">A breathable architecture map for WORLDLINE. The control room calls Lambda. Lambda uses Bedrock, CockroachDB, and S3. CockroachDB powers vector recall, historical MVCC reads, serializable commitments, and sends a changefeed through ECS back to the control room.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#e8e6ef"/></marker>
    <style>
      .box{fill:#ececff;stroke:#8f68ea;stroke-width:2}.db{fill:#ececff;stroke:#8f68ea;stroke-width:2}.line{fill:none;stroke:#e8e6ef;stroke-width:2.5;marker-end:url(#arrow)}.label{fill:#38383e;font:400 26px Arial,sans-serif;text-anchor:middle}.small{fill:#38383e;font:400 20px Arial,sans-serif;text-anchor:middle}.caption{fill:#b9b9c4;font:500 15px Arial,sans-serif;letter-spacing:3px}.num{fill:#8f68ea;font:700 18px Arial,sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#000"/>
  <text class="caption" x="60" y="58">WORLDLINE · SHARED EPISODIC MEMORY → SAFE FUTURE COMMITMENT</text>

  <!-- Primary request path: intentionally one horizontal lane. -->
  <rect class="box" x="80" y="410" width="360" height="142"/>
  <text class="label" x="260" y="468">WORLDLINE control room</text><text class="small" x="260" y="510">React · Cloudflare Workers</text>
  <rect class="box" x="610" y="410" width="350" height="142"/>
  <text class="label" x="785" y="468">AWS Lambda</text><text class="small" x="785" y="510">typed route agent</text><text class="small" x="785" y="538">recall · validate · commit</text>
  <path class="line" d="M440 481H610"/>

  <!-- Lambda dependencies: each gets its own empty lane. -->
  <rect class="box" x="1110" y="110" width="365" height="142"/>
  <text class="label" x="1292" y="168">Amazon Bedrock</text><text class="small" x="1292" y="208">Titan embeddings + Nova ranking</text>
  <path class="line" d="M890 410C960 330 1020 235 1110 190"/>

  <g transform="translate(1120 365)">
    <path class="db" d="M0 28C0 10 58 0 130 0S260 10 260 28V168C260 186 202 196 130 196S0 186 0 168Z"/><ellipse cx="130" cy="28" rx="130" ry="28" fill="#ececff" stroke="#8f68ea" stroke-width="2"/>
    <text class="label" x="130" y="104">Amazon S3</text><text class="small" x="130" y="140">versioned receipts</text>
  </g>
  <path class="line" d="M960 480H1120"/>

  <!-- CockroachDB is the central state plane. -->
  <g transform="translate(1040 675)">
    <path class="db" d="M0 34C0 11 88 0 195 0S390 11 390 34V220C390 243 302 254 195 254S0 243 0 220Z"/><ellipse cx="195" cy="34" rx="195" ry="34" fill="#ececff" stroke="#8f68ea" stroke-width="2"/>
    <text class="label" x="195" y="112">CockroachDB Cloud on AWS</text><text class="small" x="195" y="154">episodic memory + transactions</text><text class="small" x="195" y="190">us-east-1 · eu-west-1 · ap-south-1</text>
  </g>
  <path class="line" d="M850 552C900 620 965 690 1040 735"/>

  <!-- CockroachDB capabilities: short exits in a separate right-hand lane. -->
  <rect class="box" x="1580" y="160" width="280" height="128"/>
  <text class="label" x="1720" y="214">Distributed vector index</text><text class="small" x="1720" y="252">region + vehicle-class recall</text>
  <path class="line" d="M1430 720C1515 650 1530 360 1580 230"/>

  <rect class="box" x="1580" y="430" width="280" height="128"/>
  <text class="label" x="1720" y="484">MVCC time travel</text><text class="small" x="1720" y="522">AS OF SYSTEM TIME · HLC</text>
  <path class="line" d="M1430 765C1500 720 1525 610 1580 494"/>

  <rect class="box" x="1535" y="715" width="325" height="145"/>
  <text class="label" x="1697" y="772">Serializable commitment</text><text class="small" x="1697" y="812">capacity + cells + decision + outbox</text>
  <path class="line" d="M1430 810H1535"/>

  <!-- Skill and CDC paths stay below the primary request lane. -->
  <rect class="box" x="530" y="690" width="340" height="125"/>
  <text class="label" x="700" y="744">CockroachDB Agent Skills</text><text class="small" x="700" y="782">transaction · privilege · health</text>
  <path class="line" d="M785 690V552"/>

  <rect class="box" x="560" y="915" width="300" height="100"/>
  <text class="label" x="710" y="958">ECS Fargate</text><text class="small" x="710" y="990">changefeed projection</text>
  <path class="line" d="M1040 865C965 900 925 960 860 965"/>
  <path class="line" d="M560 965H305V552"/>

  <!-- Tiny numbered key keeps the flow readable at a glance. -->
  <circle cx="83" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="83" y="1036">1</text><text class="caption" x="105" y="1036">request</text>
  <circle cx="230" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="230" y="1036">2</text><text class="caption" x="252" y="1036">Bedrock inference</text>
  <circle cx="490" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="490" y="1036">3</text><text class="caption" x="512" y="1036">CockroachDB admission</text>
  <circle cx="820" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="820" y="1036">4</text><text class="caption" x="842" y="1036">evidence</text>
  <circle cx="1025" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="1025" y="1036">5</text><text class="caption" x="1047" y="1036">CDC projection</text>
  <circle cx="1325" cy="1030" r="11" fill="#8f68ea"/><text class="num" x="1325" y="1036">6</text><text class="caption" x="1347" y="1036">authoritative UI</text>
</svg>
