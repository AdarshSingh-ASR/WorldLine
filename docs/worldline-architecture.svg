<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">WORLDLINE architecture</title>
  <desc id="desc">WORLDLINE control room calls a Lambda route agent, which uses Bedrock, CockroachDB vector memory and serializable transactions, and S3 receipts. CockroachDB changefeeds flow through ECS back to the control room.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#333338"/></marker>
    <style>
      .box{fill:#ececff;stroke:#8f68ea;stroke-width:2}.db{fill:#ececff;stroke:#8f68ea;stroke-width:2}.line{fill:none;stroke:#333338;stroke-width:2.5;marker-end:url(#arrow)}.label{fill:#38383e;font:400 27px Arial,sans-serif;text-anchor:middle}.small{fill:#38383e;font:400 22px Arial,sans-serif;text-anchor:middle}.tiny{fill:#38383e;font:400 18px Arial,sans-serif;text-anchor:middle}.caption{fill:#b9b9c4;font:500 16px Arial,sans-serif;letter-spacing:3px}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#000"/>
  <text class="caption" x="54" y="60">WORLDLINE · MEMORY → SAFE FUTURE COMMITMENT</text>
  <rect class="box" x="45" y="405" width="400" height="140"/>
  <text class="label" x="245" y="462">WORLDLINE control room</text><text class="label" x="245" y="500">React · Cloudflare Workers</text>
  <rect class="box" x="365" y="690" width="440" height="160"/>
  <text class="label" x="585" y="747">CockroachDB Agent Skills</text><text class="small" x="585" y="787">transaction · privilege · health</text>
  <rect class="box" x="760" y="500" width="330" height="160"/>
  <text class="label" x="925" y="558">AWS Lambda</text><text class="small" x="925" y="602">typed route agent</text><text class="tiny" x="925" y="632">recall · validate · commit</text>
  <rect class="box" x="1110" y="100" width="355" height="155"/>
  <text class="label" x="1287" y="158">Amazon Bedrock</text><text class="small" x="1287" y="202">Titan embeddings + Nova ranking</text>
  <g transform="translate(1170 392)">
    <path class="db" d="M0 28C0 10 58 0 130 0S260 10 260 28V168C260 186 202 196 130 196S0 186 0 168Z"/><ellipse cx="130" cy="28" rx="130" ry="28" fill="#ececff" stroke="#8f68ea" stroke-width="2"/>
    <text class="label" x="130" y="103">Amazon S3</text><text class="small" x="130" y="139">versioned evidence</text><text class="small" x="130" y="169">receipts</text>
  </g>
  <g transform="translate(1030 710)">
    <path class="db" d="M0 32C0 11 83 0 185 0S370 11 370 32V220C370 241 287 252 185 252S0 241 0 220Z"/><ellipse cx="185" cy="32" rx="185" ry="32" fill="#ececff" stroke="#8f68ea" stroke-width="2"/>
    <text class="label" x="185" y="111">CockroachDB Cloud on AWS</text><text class="small" x="185" y="153">episodic memory + transactions</text><text class="small" x="185" y="190">us-east-1 · eu-west-1 · ap-south-1</text>
  </g>
  <rect class="box" x="1540" y="125" width="330" height="150"/>
  <text class="label" x="1705" y="181">Distributed vector index</text><text class="small" x="1705" y="221">region + vehicle-class recall</text>
  <rect class="box" x="1540" y="440" width="330" height="145"/>
  <text class="label" x="1705" y="496">MVCC time travel</text><text class="small" x="1705" y="536">AS OF SYSTEM TIME · HLC receipt</text>
  <rect class="box" x="1500" y="735" width="370" height="160"/>
  <text class="label" x="1685" y="792">Serializable commitment</text><text class="small" x="1685" y="832">capacity + exclusion cells + outbox</text>
  <rect class="box" x="690" y="910" width="290" height="120"/>
  <text class="label" x="835" y="958">ECS Fargate</text><text class="small" x="835" y="995">changefeed projection</text>
  <path class="line" d="M445 475H758"/><path class="line" d="M805 680C700 710 690 740 760 748"/><path class="line" d="M970 500C1010 408 1050 320 1110 228"/><path class="line" d="M1090 578H1170"/><path class="line" d="M1090 620C1120 680 1160 700 1215 710"/><path class="line" d="M1400 750C1460 690 1510 620 1540 550"/><path class="line" d="M1400 742C1480 590 1495 365 1540 253"/><path class="line" d="M1400 840H1498"/><path class="line" d="M1030 900C965 920 930 935 980 955"/><path class="line" d="M690 970C530 970 375 890 300 545"/>
  <text class="caption" x="470" y="450">LIVE PLAN + COMMIT</text><text class="caption" x="1000" y="355">EMBED + RANK</text><text class="caption" x="1145" y="675">ATOMIC RESERVE</text><text class="caption" x="650" y="900">CDC CONFIRMS</text>
</svg>
